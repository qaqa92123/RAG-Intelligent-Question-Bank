<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识库管理</title>
  <link rel="stylesheet" href="/assets/css/graindashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      padding: 30px;
      background: #f8f9fa;
    }
    .file-item {
      transition: all 0.3s ease;
    }
    .file-item:hover {
      background-color: #f0f0f0;
    }
    .status-badge {
      font-size: 0.85em;
    }
    .upload-area {
      border: 2px dashed #007bff;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      background: #f8f9ff;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .upload-area:hover {
      border-color: #0056b3;
      background: #e7f1ff;
    }
    .upload-area.dragover {
      border-color: #28a745;
      background: #e7ffe7;
    }
    .action-btn {
      margin-right: 5px;
    }
    .stats-card {
      border-left: 4px solid #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 页头导航 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">知识库管理</h1>
      <div>
        <a href="/question-bank" class="btn btn-outline-warning me-2">题库管理</a>
        <a href="/" class="btn btn-outline-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
          </svg>
          返回试卷生成
        </a>
      </div>
    </div>

    <!-- 状态统计卡片 -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card stats-card">
          <div class="card-body">
            <h6 class="text-muted mb-2">知识库状态</h6>
            <h3 id="kb-status" class="mb-0">
              <span class="spinner-border spinner-border-sm" role="status"></span>
              <span class="ms-2">检查中...</span>
            </h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stats-card" style="border-left-color: #28a745;">
          <div class="card-body">
            <h6 class="text-muted mb-2">文档数量</h6>
            <h3 id="doc-count" class="mb-0">
              <span class="spinner-border spinner-border-sm" role="status"></span>
            </h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stats-card" style="border-left-color: #ffc107;">
          <div class="card-body">
            <h6 class="text-muted mb-2">向量实体数</h6>
            <h3 id="entity-count" class="mb-0">
              <span class="spinner-border spinner-border-sm" role="status"></span>
            </h3>
          </div>
        </div>
      </div>
    </div>

    <!-- 上传区域 -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">上传文档</h5>
      </div>
      <div class="card-body">
        <div class="upload-area" id="upload-area">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-cloud-arrow-up mb-3" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/>
            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
          </svg>
          <h5>点击上传或拖拽文件到此处</h5>
          <p class="text-muted mb-0">支持 TXT、DOCX、PDF 格式</p>
          <input type="file" id="file-input" accept=".txt,.docx,.pdf" style="display: none;">
        </div>
        <div id="upload-progress" class="mt-3" style="display: none;">
          <div class="progress">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
          </div>
          <p id="upload-status" class="text-center mt-2 mb-0"></p>
        </div>
      </div>
    </div>

    <!-- 文件列表 -->
    <div class="card">
      <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">已上传文档</h5>
        <button class="btn btn-sm btn-light" onclick="refreshFileList()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
          </svg>
          刷新
        </button>
      </div>
      <div class="card-body">
        <div id="file-list-container">
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2 text-muted">正在加载文件列表...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 危险操作区域 -->
    <div class="card mt-4 border-danger">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0">危险操作</h5>
      </div>
      <div class="card-body">
        <p class="text-muted mb-3">以下操作不可恢复，请谨慎执行：</p>
        <button class="btn btn-danger" onclick="clearKnowledgeBase()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
          </svg>
          清空知识库
        </button>
        <small class="text-muted d-block mt-2">将删除所有向量数据和上传的文件</small>
      </div>
    </div>
  </div>

  <!-- Toast 通知容器 -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto" id="toast-title">通知</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-body">
        操作成功
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toast 通知函数
    function showToast(title, message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastTitle = document.getElementById('toast-title');
      const toastBody = document.getElementById('toast-body');
      const toastHeader = toast.querySelector('.toast-header');
      
      toastTitle.textContent = title;
      toastBody.textContent = message;
      
      // 根据类型设置样式
      toastHeader.className = 'toast-header';
      if (type === 'success') {
        toastHeader.classList.add('bg-success', 'text-white');
      } else if (type === 'error') {
        toastHeader.classList.add('bg-danger', 'text-white');
      } else if (type === 'warning') {
        toastHeader.classList.add('bg-warning');
      }
      
      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
    }

    // 加载知识库状态
    async function loadKBStatus() {
      try {
        const response = await fetch('/rag/status/');
        const data = await response.json();
        
        const statusEl = document.getElementById('kb-status');
        const entityCountEl = document.getElementById('entity-count');
        
        if (data.status === 'success') {
          if (data.collection_exists) {
            statusEl.innerHTML = '<span class="badge bg-success">运行中</span>';
            entityCountEl.textContent = data.num_entities.toLocaleString();
          } else {
            statusEl.innerHTML = '<span class="badge bg-warning">未初始化</span>';
            entityCountEl.textContent = '0';
          }
        } else {
          statusEl.innerHTML = '<span class="badge bg-danger">错误</span>';
          entityCountEl.textContent = '-';
        }
      } catch (error) {
        console.error('加载状态失败:', error);
        document.getElementById('kb-status').innerHTML = '<span class="badge bg-secondary">不可用</span>';
        document.getElementById('entity-count').textContent = '-';
      }
    }

    // 加载文件列表
    async function loadFileList() {
      try {
        const response = await fetch('/uploads/');
        const data = await response.json();
        
        const container = document.getElementById('file-list-container');
        const docCountEl = document.getElementById('doc-count');
        
        if (data.status === 'success' && data.files && data.files.length > 0) {
          docCountEl.textContent = data.files.length;
          
          let html = '<div class="list-group">';
          data.files.forEach(file => {
            const fileExt = file.split('.').pop().toLowerCase();
            let icon = '📄';
            if (fileExt === 'pdf') icon = '📕';
            else if (fileExt === 'docx' || fileExt === 'doc') icon = '📘';
            else if (fileExt === 'txt') icon = '📝';
            
            html += `
              <div class="list-group-item file-item d-flex justify-content-between align-items-center">
                <div>
                  <span style="font-size: 1.5em; margin-right: 10px;">${icon}</span>
                  <strong>${file}</strong>
                  <span class="badge bg-secondary ms-2">${fileExt.toUpperCase()}</span>
                </div>
                <div>
                  <button class="btn btn-sm btn-outline-danger action-btn" onclick="deleteFile('${file}')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                      <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                      <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                    </svg>
                    删除
                  </button>
                </div>
              </div>
            `;
          });
          html += '</div>';
          container.innerHTML = html;
        } else {
          docCountEl.textContent = '0';
          container.innerHTML = `
            <div class="text-center py-5 text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-inbox mb-3" viewBox="0 0 16 16">
                <path d="M4.98 4a.5.5 0 0 0-.39.188L1.54 8H6a.5.5 0 0 1 .5.5 1.5 1.5 0 1 0 3 0A.5.5 0 0 1 10 8h4.46l-3.05-3.812A.5.5 0 0 0 11.02 4H4.98zm9.954 5H10.45a2.5 2.5 0 0 1-4.9 0H1.066l.32 2.562a.5.5 0 0 0 .497.438h12.234a.5.5 0 0 0 .496-.438L14.933 9zM3.809 3.563A1.5 1.5 0 0 1 4.981 3h6.038a1.5 1.5 0 0 1 1.172.563l3.7 4.625a.5.5 0 0 1 .105.374l-.39 3.124A1.5 1.5 0 0 1 14.117 13H1.883a1.5 1.5 0 0 1-1.489-1.314l-.39-3.124a.5.5 0 0 1 .106-.374l3.7-4.625z"/>
              </svg>
              <p>暂无上传文件</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('加载文件列表失败:', error);
        document.getElementById('doc-count').textContent = '-';
        document.getElementById('file-list-container').innerHTML = `
          <div class="alert alert-danger">加载文件列表失败: ${error.message}</div>
        `;
      }
    }

    // 刷新列表
    function refreshFileList() {
      loadKBStatus();
      loadFileList();
      showToast('刷新', '已刷新数据', 'success');
    }

    // 上传文件
    async function uploadFile(file) {
      const progressDiv = document.getElementById('upload-progress');
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('upload-status');
      
      progressDiv.style.display = 'block';
      progressBar.style.width = '0%';
      statusText.textContent = '准备上传...';
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        progressBar.style.width = '30%';
        statusText.textContent = '正在上传...';
        
        const response = await fetch('/rag/create/', {
          method: 'POST',
          body: formData
        });
        
        progressBar.style.width = '70%';
        statusText.textContent = '正在处理...';
        
        const data = await response.json();
        
        progressBar.style.width = '100%';
        
        if (data.status === 'success') {
          statusText.textContent = '上传成功！';
          showToast('上传成功', data.message, 'success');
          setTimeout(() => {
            progressDiv.style.display = 'none';
            refreshFileList();
          }, 1500);
        } else {
          statusText.textContent = '上传失败';
          showToast('上传失败', data.message, 'error');
          setTimeout(() => {
            progressDiv.style.display = 'none';
          }, 3000);
        }
      } catch (error) {
        console.error('上传失败:', error);
        statusText.textContent = '上传失败';
        showToast('上传失败', error.message, 'error');
        setTimeout(() => {
          progressDiv.style.display = 'none';
        }, 3000);
      }
    }

    // 删除文件
    async function deleteFile(filename) {
      if (!confirm(`确定要删除文件 "${filename}" 吗？`)) {
        return;
      }
      
      try {
        const response = await fetch(`/uploads/${filename}`, {
          method: 'DELETE'
        });
        const data = await response.json();
        
        if (data.status === 'success') {
          showToast('删除成功', data.message, 'success');
          refreshFileList();
        } else {
          showToast('删除失败', data.message, 'error');
        }
      } catch (error) {
        console.error('删除失败:', error);
        showToast('删除失败', error.message, 'error');
      }
    }

    // 清空知识库
    async function clearKnowledgeBase() {
      if (!confirm('确定要清空整个知识库吗？此操作将删除所有向量数据和上传的文件，且不可恢复！')) {
        return;
      }
      
      if (!confirm('再次确认：你真的要清空知识库吗？')) {
        return;
      }
      
      try {
        const response = await fetch('/rag/clear/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({})
        });
        const data = await response.json();
        
        if (data.status === 'success') {
          showToast('清空成功', data.message, 'success');
          refreshFileList();
        } else {
          showToast('清空失败', data.message, 'error');
        }
      } catch (error) {
        console.error('清空失败:', error);
        showToast('清空失败', error.message, 'error');
      }
    }

    // 文件上传事件
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');

    uploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        uploadFile(file);
      }
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        uploadFile(file);
      }
    });

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadKBStatus();
      loadFileList();
    });
  </script>
</body>
</html>
