<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户注册 - 智能题库系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px 0;
    }
    .register-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h2 {
      color: #333;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .register-header p {
      color: #666;
      font-size: 14px;
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
      padding: 12px 15px;
      border: 1px solid #ddd;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-register {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      transition: transform 0.2s;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #ddd;
    }
    .divider span {
      background: white;
      padding: 0 15px;
      position: relative;
      color: #999;
      font-size: 14px;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .alert {
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .password-strength {
      font-size: 12px;
      margin-top: 5px;
    }
    .strength-weak { color: #dc3545; }
    .strength-medium { color: #ffc107; }
    .strength-strong { color: #28a745; }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h2>🎓 智能题库系统</h2>
      <p>创建新账户</p>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/register" onsubmit="return validateForm()">
      <div class="mb-3">
        <label for="username" class="form-label">用户名</label>
        <input type="text" class="form-control" id="username" name="username" 
               placeholder="请输入用户名" required minlength="2" maxlength="20">
        <div class="form-text">2-20个字符</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">邮箱地址</label>
        <input type="email" class="form-control" id="email" name="email" 
               placeholder="请输入邮箱" required>
        <div class="form-text">用于登录系统</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" name="password" 
               placeholder="请输入密码" required minlength="6" oninput="checkPasswordStrength()">
        <div id="passwordStrength" class="password-strength"></div>
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label">确认密码</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
               placeholder="请再次输入密码" required>
        <div id="passwordMatch" class="form-text"></div>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="agree" required>
        <label class="form-check-label" for="agree">
          我已阅读并同意用户协议
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-register">注册</button>
    </form>

    <div class="divider">
      <span>或</span>
    </div>

    <div class="login-link">
      已有账户？ <a href="/login">立即登录</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function checkPasswordStrength() {
      const password = document.getElementById('password').value;
      const strengthDiv = document.getElementById('passwordStrength');
      
      if (password.length === 0) {
        strengthDiv.textContent = '';
        return;
      }
      
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/\d/)) strength++;
      if (password.match(/[^a-zA-Z\d]/)) strength++;
      
      if (strength <= 1) {
        strengthDiv.textContent = '密码强度：弱';
        strengthDiv.className = 'password-strength strength-weak';
      } else if (strength <= 2) {
        strengthDiv.textContent = '密码强度：中等';
        strengthDiv.className = 'password-strength strength-medium';
      } else {
        strengthDiv.textContent = '密码强度：强';
        strengthDiv.className = 'password-strength strength-strong';
      }
    }
    
    function validateForm() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const matchDiv = document.getElementById('passwordMatch');
      
      if (password !== confirmPassword) {
        matchDiv.textContent = '两次输入的密码不一致';
        matchDiv.style.color = '#dc3545';
        return false;
      }
      
      if (password.length < 6) {
        alert('密码长度至少为6个字符');
        return false;
      }
      
      return true;
    }
    
    // 实时检查密码匹配
    document.getElementById('confirm_password').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPassword = this.value;
      const matchDiv = document.getElementById('passwordMatch');
      
      if (confirmPassword.length === 0) {
        matchDiv.textContent = '';
        return;
      }
      
      if (password === confirmPassword) {
        matchDiv.textContent = '✓ 密码匹配';
        matchDiv.style.color = '#28a745';
      } else {
        matchDiv.textContent = '✗ 密码不匹配';
        matchDiv.style.color = '#dc3545';
      }
    });
  </script>
</body>
</html>
